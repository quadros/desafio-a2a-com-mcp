[project]
name = "agente"
version = "1.0.0"
description = "Agente Central de Salas: host MCP por dentro, servidor A2A por fora."
requires-python = ">=3.10"
dependencies = [
    "mcp==2.2.0",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agente*"]
